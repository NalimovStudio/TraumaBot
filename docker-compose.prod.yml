version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "0.0.0.0:1488:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - traefik_network
      - default
    dns:
      - 8.8.8.8
      - 1.1.1.1
  redis:
    image: redis:7-alpine
    restart: always
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - traefik_network
      - default
    dns:
      - 8.8.8.8
      - 1.1.1.1
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi
    restart: unless-stopped

    extra_hosts:
      - "api.telegram.org:149.154.167.220"
      - "api.telegram.org:149.154.167.4"
      - "api.telegram.org:149.154.167.5"

    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 77.88.8.8

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: >
      sh -c "poetry run uvicorn asgi:app --host 0.0.0.0 --port 8000 --workers 1"

    volumes:
      - ./:/TraumaBot

    networks:
      - traefik_network
      - default

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  traefik:
    build:
      context: .
      dockerfile: Dockerfile.traefik
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - --log.level=DEBUG
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - traefik_network
      - default
    dns:
      - 8.8.8.8
      - 1.1.1.1
  arq_worker:
    build: .
    container_name: worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}  # use service name 'db' as host
      - DEBUG=false
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      poetry run arq source.infrastructure.configs.arq_config.WorkerSettings
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  traefik_acme:

networks:
  traefik_network:
    driver: bridge